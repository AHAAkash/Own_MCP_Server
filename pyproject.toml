[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-mcp-platform"
version = "0.2.0"
description = "Tenant-scoped MCP server with authenticated Streamable HTTP"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9,<2",
  "starlette>=0.27,<2",
  "uvicorn>=0.30,<1",
  "PyJWT>=2.8,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
]

[project.optional-dependencies]
sampling = ["anthropic>=0.40"]
test = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
advanced-mcp-server = "mcp_advanced.server:main"
advanced-mcp-admin = "mcp_advanced.cli:main"

[tool.setuptools]
packages = ["mcp_advanced"]

[tool.setuptools.package-data]
mcp_advanced = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
